name: validate

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same PR; never cancel default-branch pushes.
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python-pipeline:
    name: Python pipeline (validate spec, generate handoff)
    runs-on: ubuntu-latest
    # Without a cap a hung step runs to GitHub's 360-minute default.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r plugin/scripts/requirements.txt

      - name: Validate tea-tracker reference spec package
        run: python plugin/scripts/validate_spec.py examples/tea-tracker/spec-package

      - name: Smoke-test handoff generator
        run: python plugin/scripts/generate_handoff.py examples/tea-tracker/spec-package -o /tmp/handoff.md

      - name: Smoke-test compile_spec CLI
        run: python plugin/scripts/compile_spec.py --help

  enforcement:
    name: ADR enforcement checks (warn = report only, block = fail)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r plugin/scripts/requirements.txt

      - name: Run enforcement suite
        run: python checks/run_checks.py --ci --json enforcement-report.json

      # ADR 0018: push the suite's finding count to the ops dashboard, which
      # expects `audit.finding_count` from plugin_skill repos. Push-only so a
      # fork PR can't write to the dashboard; `!cancelled()` so a run with
      # blockers still reports (with raised severity) rather than vanishing.
      # Missing OPS_URL / OPS_INGEST_TOKEN fails the step loudly.
      - name: Report audit.finding_count to ops
        if: ${{ !cancelled() && github.event_name == 'push' }}
        run: python checks/report_to_ops.py enforcement-report.json
        env:
          OPS_URL: ${{ vars.OPS_URL }}
          OPS_INGEST_TOKEN: ${{ secrets.OPS_INGEST_TOKEN }}
          # Only needed while /ingest sits behind Cloudflare Access without a
          # bypass policy; empty values are ignored by the script.
          CF_ACCESS_CLIENT_ID: ${{ secrets.OPS_CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.OPS_CF_ACCESS_CLIENT_SECRET }}
